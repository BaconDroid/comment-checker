name: sf differential

# Advisory compatibility check against the reference classifier. Weekly and on demand only,
# so it never gates a pull request; the README documents it as off-gate. The .github tree is
# byte-shared with the sibling repository, so this file must behave in both: it runs where
# eval/diff_vs_sf.py exists and reports a skip where it does not.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TSLP_LINK_MODE: static

jobs:
  differential:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal

      - name: Build the local checker
        run: cargo build --release

      - name: Differential
        run: |
          if [ ! -f eval/diff_vs_sf.py ]; then
            echo "no sf differential harness in this repository; skipping"
            exit 0
          fi
          package="$(python3 -c 'import tomllib;print(tomllib.load(open("Cargo.toml","rb"))["package"]["name"])')"
          git clone --no-checkout --filter=blob:none https://github.com/systemfsoftware/comment-checker.git sf-checkout
          git -C sf-checkout fetch --depth 1 origin 44e1c87
          git -C sf-checkout checkout 44e1c87
          (cd sf-checkout && cargo build --release)
          python3 eval/diff_vs_sf.py --cc "target/release/${package}" \
            --sf sf-checkout/target/release --root src --root tests
